services:
  blitz-practice:
    image: blitz-practice:@@RELEASE@@
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    ports:
      - "@@BIND_IP@@:@@PORT@@:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
